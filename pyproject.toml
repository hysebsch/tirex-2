[project]
name = "tirex-2"
version = "0.2.1"
description = "TiRex-2 time series forecasting inference"
authors = [
    { name = "NXAI" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "torch>=2.10.0; python_version >= '3.14'",
    "numpy>=2.1.3",
    "numpy>=2.3.3; python_version >= '3.14'",
    "einops~=0.8.1",
    "flashrnn>=1.0.5",
    "xlstm~=2.0.3",
    "PyYAML>=6",
    "huggingface-hub>=0.35.3",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.0",
    "plotly",
    "jupyterlab",
    "toolz>=0.12.1",
]

fev = [
    "fev",
    "datasets>=4.4.0,<5",
    "pyarrow>=22.0.0",
]

gluonts = [
    "gluonts>=0.16.2",
    "pandas~=2.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# uv configuration
# NOTE: The project metadata uses the default PyPI torch wheel. For development on
# CUDA hardware, the Makefile installs the correct torch variant explicitly via
# requirements/torch-cu128.txt before installing the project. See
# scripts/setup_hardware.py for DGX Spark / CUDA 13 driver handling.
[tool.uv]
managed = true
default-groups = ["dev", "test"]

# Dependency groups for development (PEP 735)
[dependency-groups]
dev = [
    "setuptools>=68",
    "ruff>=0.11.0",
    "pyupgrade>=3.21.0",
    "build>=1.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

# ruff
[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "archive",
]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["I001"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"

# setuptools
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# pytest
[tool.pytest.ini_options]
testpaths = [
    "test",
]
